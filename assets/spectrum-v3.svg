<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Engineering Spectrum">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="290" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="36" y="38" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2">ARCHITECTURE &amp; DISCIPLINES // MULTI-DOMAIN STACK</text>
  <text x="1164" y="38" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">4 CORE PILLARS</text>
  <line x1="36" y1="52" x2="1164" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Pillar 1: AI & High-Performance Systems -->
  <g transform="translate(36, 70)">
    <rect width="267" height="196" rx="12" fill="#0d1629" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="267" height="4" rx="2" fill="url(#c1)"/>
    <rect x="18" y="20" width="38" height="22" rx="5" fill="#0c2a3a" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="37" y="35" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">AI / HPC</text>
    <text x="18" y="66" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="15.5" font-weight="700">LLM Runtimes &amp; Agents</text>
    <text x="18" y="90" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">Host-RAM KV cache streaming,</text>
    <text x="18" y="108" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">async double-buffered PCIe DMA,</text>
    <text x="18" y="126" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">Q4_0 quantization &amp; safe autonomous</text>
    <text x="18" y="144" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">agent execution layers.</text>
    <text x="18" y="178" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">C++ · CUDA · Python · Strata</text>
  </g>

  <!-- Pillar 2: Binary & Automotive Calibration -->
  <g transform="translate(323, 70)">
    <rect width="267" height="196" rx="12" fill="#131127" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="267" height="4" rx="2" fill="url(#c2)"/>
    <rect x="18" y="20" width="44" height="22" rx="5" fill="#261338" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="40" y="35" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">BINARY</text>
    <text x="18" y="66" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="15.5" font-weight="700">ECU &amp; Vehicle Systems</text>
    <text x="18" y="90" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">AI-assisted ECU calibration &amp; ROM</text>
    <text x="18" y="108" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">binary editing (MRC Tuner Studio),</text>
    <text x="18" y="126" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">VAG ABS/ESP long-coding synthesis</text>
    <text x="18" y="144" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">&amp; high-rate CAN/OBD-II telemetry.</text>
    <text x="18" y="178" fill="#e879f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">HEX/ROM · UDS · CAN · ESP32</text>
  </g>

  <!-- Pillar 3: Enterprise SaaS & Desktop -->
  <g transform="translate(610, 70)">
    <rect width="267" height="196" rx="12" fill="#1a1219" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="267" height="4" rx="2" fill="url(#c3)"/>
    <rect x="18" y="20" width="44" height="22" rx="5" fill="#331a12" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="40" y="35" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">PRODUCT</text>
    <text x="18" y="66" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="15.5" font-weight="700">Full-Stack &amp; Desktop Apps</text>
    <text x="18" y="90" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">Multi-tenant CRM/ERP SaaS suites,</text>
    <text x="18" y="108" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">cross-platform Tauri desktop shells,</text>
    <text x="18" y="126" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">reactive web interfaces and companion</text>
    <text x="18" y="144" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">hardware control surfaces.</text>
    <text x="18" y="178" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Laravel · Vue · Tauri · TypeScript</text>
  </g>

  <!-- Pillar 4: Media Ecosystems & Cloud Infra -->
  <g transform="translate(897, 70)">
    <rect width="267" height="196" rx="12" fill="#0b1a1e" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="267" height="4" rx="2" fill="url(#c4)"/>
    <rect x="18" y="20" width="44" height="22" rx="5" fill="#0c2e28" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="40" y="35" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">INFRA</text>
    <text x="18" y="66" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="15.5" font-weight="700">Media &amp; Cloud Automation</text>
    <text x="18" y="90" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">Large-scale plugin ecosystems</text>
    <text x="18" y="108" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">with autonomous CI/CD pipelines,</text>
    <text x="18" y="126" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">edge workers, zero-touch release</text>
    <text x="18" y="144" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="12">distribution &amp; self-healing builds.</text>
    <text x="18" y="178" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Kotlin · Actions · AWS · Cloudflare</text>
  </g>
</svg>
