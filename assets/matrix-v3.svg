<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Technical Matrix">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c18"/>
      <stop offset="1" stop-color="#0c1527"/>
    </linearGradient>
    <linearGradient id="mLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#8b5cf6"/>
      <stop offset="0.7" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="16" fill="url(#mBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="48" y="0" width="1104" height="3" fill="url(#mLine)"/>

  <text x="36" y="36" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2">TECHNICAL MATRIX // LANGUAGES, RUNTIMES &amp; INFRASTRUCTURE</text>
  <text x="1164" y="36" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">PRODUCTION STACK</text>
  <line x1="36" y1="50" x2="1164" y2="50" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="36" y="82" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">SYSTEMS &amp; AI</text>
  <g transform="translate(210, 64)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e2e8f0">
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="69" y="17" text-anchor="middle">C++ / Modern C</text>
    <rect x="148" y="0" width="166" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="231" y="17" text-anchor="middle">CUDA &amp; PCIe DMA</text>
    <rect x="324" y="0" width="174" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="411" y="17" text-anchor="middle">GGUF / Q4_0 / KV</text>
    <rect x="508" y="0" width="110" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="563" y="17" text-anchor="middle">Python 3</text>
    <rect x="628" y="0" width="154" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="705" y="17" text-anchor="middle">Tauri / Rust Shell</text>
    <rect x="792" y="0" width="162" height="26" rx="6" fill="#0d1b30" stroke="#22d3ee" stroke-opacity="0.4"/><text x="873" y="17" text-anchor="middle">Agent Harnesses</text>
  </g>

  <!-- Row 2 -->
  <text x="36" y="122" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">WEB &amp; SAAS</text>
  <g transform="translate(210, 104)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e2e8f0">
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="69" y="17" text-anchor="middle">PHP 8 / Laravel</text>
    <rect x="148" y="0" width="144" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="220" y="17" text-anchor="middle">Vue.js / Vite</text>
    <rect x="302" y="0" width="176" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="390" y="17" text-anchor="middle">TypeScript / ES2026</text>
    <rect x="488" y="0" width="132" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="554" y="17" text-anchor="middle">Kotlin / Gradle</text>
    <rect x="630" y="0" width="154" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="707" y="17" text-anchor="middle">MySQL / SQLite</text>
    <rect x="794" y="0" width="160" height="26" rx="6" fill="#17132e" stroke="#a855f7" stroke-opacity="0.4"/><text x="874" y="17" text-anchor="middle">REST / WebSockets</text>
  </g>

  <!-- Row 3 -->
  <text x="36" y="162" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">BINARY &amp; AUTO</text>
  <g transform="translate(210, 144)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e2e8f0">
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="84" y="17" text-anchor="middle">ECU ROM Calibration</text>
    <rect x="178" y="0" width="158" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="257" y="17" text-anchor="middle">UDS / ISO 15765-4</text>
    <rect x="346" y="0" width="150" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="421" y="17" text-anchor="middle">CAN 2.0B / OBD-II</text>
    <rect x="506" y="0" width="156" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="584" y="17" text-anchor="middle">VAG Long-Coding</text>
    <rect x="672" y="0" width="136" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="740" y="17" text-anchor="middle">ESP32 / FreeRTOS</text>
    <rect x="818" y="0" width="136" height="26" rx="6" fill="#231812" stroke="#f59e0b" stroke-opacity="0.4"/><text x="886" y="17" text-anchor="middle">Hex / AST Diffing</text>
  </g>

  <!-- Row 4 -->
  <text x="36" y="200" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">CLOUD &amp; OPS</text>
  <text x="210" y="200" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">AWS (eu-north-1)  ·  Cloudflare Edge &amp; Workers  ·  GitHub Actions Autonomous CI  ·  Linux / Windows</text>
