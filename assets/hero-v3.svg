    <rect x="0" y="6" width="4" height="58" rx="2" fill="#22d3ee"/>
    <rect x="0" y="70" width="4" height="44" rx="2" fill="#8b5cf6"/>
    <rect x="0" y="120" width="4" height="32" rx="2" fill="#ec4899"/>
    <rect x="0" y="158" width="4" height="22" rx="2" fill="#f59e0b"/>

    <text x="26" y="48" fill="url(#nameGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">SAMET MURIÇ</text>

    <!-- Handle pill -->
    <rect x="28" y="64" width="114" height="24" rx="6" fill="#111c33" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1"/>
    <text x="85" y="80" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">@lepotane</text>

    <rect x="152" y="64" width="166" height="24" rx="6" fill="#16132b" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
    <text x="235" y="80" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">mrccorps.is-a.dev</text>

    <rect x="328" y="64" width="176" height="24" rx="6" fill="#1c1520" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="416" y="80" text-anchor="middle" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">Founder · MRC Studio</text>

    <!-- Headline -->
    <text x="28" y="122" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="600" letter-spacing="0.2">
      Systems Architect, AI Inference Engineer &amp; Full-Stack Product Builder
    </text>
    <text x="28" y="148" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
      From GPU memory streaming &amp; binary ECU calibration workstations to enterprise SaaS,
    </text>
    <text x="28" y="168" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
      automotive protocol decoders, media ecosystems and custom hardware interfaces.
    </text>
  </g>

  <!-- Right column: Telemetry / Architecture Card -->
  <g transform="translate(748, 72)">
