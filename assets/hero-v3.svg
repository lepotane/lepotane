    <!-- Pill 1 -->
    <rect x="0" y="0" width="206" height="46" rx="10" fill="#0b1629" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="20" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">01 // AI RUNTIME</text>
    <text x="16" y="36" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">KV Cache Streaming · Q4_0</text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="206" height="46" rx="10" fill="#131129" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="236" y="20" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">02 // BINARY &amp; ECU</text>
    <text x="236" y="36" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">ROM Maps · Calibration UI</text>

    <!-- Pill 3 -->
    <rect x="440" y="0" width="206" height="46" rx="10" fill="#1f1124" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
    <text x="456" y="20" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">03 // SAAS &amp; DESKTOP</text>
    <text x="456" y="36" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">CRM / ERP · Multi-Tenant</text>

    <!-- Pill 4 -->
    <rect x="660" y="0" width="206" height="46" rx="10" fill="#1f1710" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="676" y="20" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">04 // AUTOMOTIVE</text>
    <text x="676" y="36" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">13 VAG Families · Telemetry</text>

    <!-- Pill 5 -->
    <rect x="880" y="0" width="208" height="46" rx="10" fill="#0b1f1d" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="896" y="20" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.4">05 // ECOSYSTEMS</text>
    <text x="896" y="36" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">MRC Builds · Agent Safety</text>
  </g>
</svg>
