<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Samet Muriç — Systems, AI &amp; Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060913"/>
      <stop offset="0.45" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.33" stop-color="#6366f1"/>
      <stop offset="0.66" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#090f1d" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.18" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.82" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.6" cy="0.15" r="0.35">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glowCyan)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glowPurple)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glowAmber)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="17.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top spectrum accent bar -->
  <rect x="48" y="0" width="1104" height="3" fill="url(#topBar)"/>

  <!-- Header chrome bar -->
  <g transform="translate(56, 32)">
    <circle cx="8" cy="8" r="4.5" fill="#22d3ee"/>
    <circle cx="24" cy="8" r="4.5" fill="#8b5cf6"/>
    <circle cx="40" cy="8" r="4.5" fill="#f59e0b"/>
    <text x="62" y="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2">MRC CORPS // ENGINEERING DOSSIER · REV 2026.11</text>
    <rect x="945" y="-3" width="143" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="961" cy="8" r="4" fill="#10b981"/>
    <text x="973" y="12" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2">SYSTEMS ONLINE</text>
  </g>

