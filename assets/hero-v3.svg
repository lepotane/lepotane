    <line x1="22" y1="38" x2="374" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1 -->
    <circle cx="30" cy="58" r="4" fill="#22d3ee"/>
    <text x="44" y="62" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">LLM Inference &amp; GPU Memory</text>
    <text x="374" y="62" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">C++ · CUDA · PCIe DMA</text>

    <!-- Row 2 -->
    <circle cx="30" cy="88" r="4" fill="#a855f7"/>
    <text x="44" y="92" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Binary &amp; ECU Calibration</text>
    <text x="374" y="92" text-anchor="end" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">MRC Tuner Studio</text>

    <!-- Row 3 -->
    <circle cx="30" cy="118" r="4" fill="#ec4899"/>
    <text x="44" y="122" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Enterprise SaaS &amp; Desktop</text>
    <text x="374" y="122" text-anchor="end" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Laravel · Vue · Tauri</text>

    <!-- Row 4 -->
    <circle cx="30" cy="148" r="4" fill="#f59e0b"/>
    <text x="44" y="152" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Automotive Protocols &amp; HIL</text>
    <text x="374" y="152" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">UDS · CAN · VAG ABS</text>

    <!-- Row 5 -->
    <circle cx="30" cy="178" r="4" fill="#10b981"/>
    <text x="44" y="182" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Agent Tooling &amp; Streaming</text>
    <text x="374" y="182" text-anchor="end" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Python · Kotlin · CI</text>
